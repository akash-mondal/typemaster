<!DOCTYPE html>
<meta charset="utf-8">
<title>KATA - local harness</title>
<style>
  html,body{margin:0;height:100%;background:#05070E;display:grid;place-items:center}
  canvas{image-rendering:pixelated;width:960px;height:720px;outline:1px solid #1e2735}
  #log{position:fixed;left:8px;bottom:6px;color:#4F7A62;font:11px ui-monospace,monospace;white-space:pre}
</style>
<canvas id="c" width="320" height="240" tabindex="0"></canvas>
<div id="log"></div>
<script type="module">
// Emulates exactly what the TYPEMAXX engine hands a game: a 2D context at the
// pixel-grid size, seconds, now, and an input object whose pull() drains one
// frame's keystrokes. Same key mapping as app.js.
import KATA from '../../games/kata.js';

const cvs = document.getElementById('c');
const g = cvs.getContext('2d');
window.TYPEMAXX = { pixel: null };
window.TYPEMAXX_SETGAME = () => { document.getElementById('log').textContent = 'exit requested'; };

const INPUT = {
  _pend: { chars: [], keys: [], back: 0, enter: 0 },
  _cur: { chars: [], keys: [], back: 0, enter: 0 },
  _rotate(){ this._cur = this._pend; this._pend = { chars: [], keys: [], back: 0, enter: 0 }; },
  pull(){ return this._cur; },
};
window.KATA_INPUT = INPUT;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  if (e.code === 'Backspace') INPUT._pend.back++;
  else if (e.code === 'Enter') INPUT._pend.enter++;
  else if (e.key && e.key.length === 1) INPUT._pend.chars.push(e.key);
  INPUT._pend.keys.push(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'Backspace'].includes(e.code)) e.preventDefault();
});

KATA.enter();
window.KATA = KATA;
// frame capture for tooling: posts a 3x nearest-neighbour PNG to the local capture server
window.cap = async (name) => {
  const big = document.createElement('canvas'); big.width = 960; big.height = 720;
  const b = big.getContext('2d'); b.imageSmoothingEnabled = false; b.drawImage(cvs, 0, 0, 960, 720);
  const r = await fetch('http://127.0.0.1:8766/' + name, { method: 'POST', body: big.toDataURL('image/png') });
  return r.ok;
};
window.send = (chars, keys, back, enter) => {
  const p = INPUT._pend;
  for (const c of chars || []) p.chars.push(c);
  for (const k of keys || []) p.keys.push(k);
  p.back += back || 0; p.enter += enter || 0;
};
window.sleep = ms => new Promise(r => setTimeout(r, ms));
// deterministic stepping for tooling: n frames of dtMs each, on a synthetic clock
let synth = 0;
window.step = (n, dtMs) => {
  window.manual = true;          // once a tool steps, the real-time loop stands down
  dtMs = dtMs || 1000 / 60;
  for (let i = 0; i < n; i++) {
    synth += dtMs;
    INPUT._rotate();
    KATA.draw(g, 320, 240, synth / 1000, synth, INPUT);
  }
  return KATA.state.mode;
};
window.manual = false;         // a human playing gets the real-time loop
let errs = 0;
function tick(now){
  requestAnimationFrame(tick);
  if (window.manual) return;       // a tool is stepping the clock; stay out of its way
  INPUT._rotate();
  try { KATA.draw(g, 320, 240, now / 1000, now, INPUT); }
  catch (e) { if (errs++ < 3) { console.error(e); document.getElementById('log').textContent = String(e.stack || e); } }
}
requestAnimationFrame(tick);
cvs.focus();
</script>
