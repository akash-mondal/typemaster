<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYPE MASTER — keyboards</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0B1020}
  body{transition:background .5s ease}
  #stage{position:fixed;inset:0}
  #hud{position:fixed;left:14px;top:12px;font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
       color:rgba(255,255,255,.40);letter-spacing:.08em;white-space:pre;pointer-events:none;z-index:4}
  #picker{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;display:flex;gap:8px;z-index:5}
  #picker button{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
       color:rgba(255,255,255,.78);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
       padding:10px 15px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);
       transition:all .16s ease}
  #picker button:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.34)}
  #picker button.on{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.42);color:#fff}
  #err{position:fixed;top:0;left:0;right:0;z-index:20;background:#d7193f;color:#fff;
       padding:12px 16px;font:12px/1.45 ui-monospace,Menlo,monospace;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<div id="err"></div>
<div id="stage"></div>
<div id="hud">TYPE MASTER</div>
<div id="picker"></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
}}
</script>

<script type="module" src="./app.js"></script>
</body>
</html>
